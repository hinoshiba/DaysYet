name: DaysYet

options:
  bundleIdPrefix: com.hinoshiba.daysyet
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "94HVVWXLK3"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  DaysYet:
    type: application
    platform: iOS
    sources:
      - path: DaysYet
        excludes:
          - Info.plist
          - DaysYet.entitlements
      - path: Shared
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ASSET_LICENSES.md
        buildPhase: resources
      - path: DATA_SOURCES.md
        buildPhase: resources
    info:
      path: DaysYet/Info.plist
      properties:
        CFBundleDisplayName: DaysYet
        CFBundleLocalizations:
          - ja
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.daysyet
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DaysYet/DaysYet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DaysYetWidget
        embed: true

  DaysYetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DaysYetWidget
        excludes:
          - Info.plist
          - DaysYetWidget.entitlements
      - path: Shared
    info:
      path: DaysYetWidget/Info.plist
      properties:
        CFBundleDisplayName: DaysYet
        CFBundleLocalizations:
          - ja
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.daysyet.widget
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: DaysYetWidget/DaysYetWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  DaysYetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaysYetTests
    dependencies:
      - target: DaysYet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinoshiba.daysyet.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  DaysYet:
    build:
      targets:
        DaysYet: all
        DaysYetWidget: all
        DaysYetTests: [test]
    test:
      targets:
        - DaysYetTests
